theme: jekyll-theme-chirpy

lang: zh-CN
timezone: Asia/Shanghai

title: 马斯克铁粉站｜埃隆·马斯克动态、语录与深度资料
tagline: 中文马斯克资料库与长期观察
description: 马斯克中文资料库，整理埃隆·马斯克关于 Tesla、SpaceX、xAI、Neuralink、机器人、人工智能和第一性原理的演讲、访谈、推文与深度分析。

bitcoin_donation: bc1q9lpnz0hl0vzyv3hlskmadjkgmt6alqugxvj5aq

category_names:
  companies: 公司
  gossip: 周边
  long: 深度
  news: 新闻
  quotes: 语录
  tweets: 推文

category_descriptions:
  companies: Tesla、SpaceX、Neuralink 等公司相关内容
  gossip: 马斯克的个人动态、家庭和周边信息
  long: 较长篇幅的深度文章和专题分析
  news: 重要事件和最新消息
  quotes: 马斯克的演讲、采访和观点整理
  tweets: 马斯克在 X 上发布的推文内容

url: "https://muskfans.cn"

github:
  username: wsgsc

social:
  name: 马斯克铁粉站
  links: []

avatar: /assets/img/avatar.png

paginate: 10

toc: false

markdown: kramdown

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

plugins:
  - jekyll-paginate
  - jekyll-archives

jekyll-archives:
  enabled:
    - categories
  layouts:
    category: category
  permalinks:
    category: /categories/:name/

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      math: false
      mermaid: false
  - scope:
      path: _tabs
    values:
      layout: page
      permalink: /:title/
